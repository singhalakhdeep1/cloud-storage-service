# The whole stack on one machine: nginx load-balancing three API instances, the web app, MongoDB, Redis,
# MinIO (S3-compatible object store) and ClamAV. Prometheus is optional (--profile monitoring).
#
#   cp .env.example .env      # then set JWT_SECRET, ENCRYPTION_KEY and the MinIO password
#   docker compose up -d --build
#   open http://localhost:8080          (MinIO console: http://localhost:9001)
#
# ClamAV downloads its signature database on first start, which takes a few minutes; until it is healthy the
# API instances wait for it.

x-api: &api
    build: .
    restart: unless-stopped
    environment:
        NODE_ENV: production
        PORT: "5000"
        TRUST_PROXY: "true"
        MONGODB_URI: mongodb://mongo:27017/cloud-storage
        REDIS_URL: redis://redis:6379
        JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
        ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env (openssl rand -hex 32)}
        ENCRYPT_AT_REST: ${ENCRYPT_AT_REST:-false}
        ADMIN_EMAIL: ${ADMIN_EMAIL:-}
        PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
        CLIENT_URL: ${PUBLIC_URL:-http://localhost:8080}
        STORAGE_PROVIDER: minio
        MINIO_ENDPOINT: minio
        MINIO_PORT: "9000"
        MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-cloudstorage}
        MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
        MINIO_BUCKET: files
        # presigned URLs are opened by browsers, which reach MinIO on the published port
        MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
        ENABLE_VIRUS_SCAN: "true"
        CLAMAV_HOST: clamav
        CLAMAV_PORT: "3310"
        MAX_FILE_SIZE: ${MAX_FILE_SIZE:-104857600}
        METRICS_TOKEN: ${METRICS_TOKEN:-}
        LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
        mongo: { condition: service_healthy }
        redis: { condition: service_healthy }
        minio-init: { condition: service_completed_successfully }
        clamav: { condition: service_healthy }

services:
    api-1: *api
    api-2: *api
    api-3: *api

    web:
        build:
            context: .
            dockerfile: frontend/Dockerfile
            args:
                NEXT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8080}/api
        restart: unless-stopped

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        ports:
            - "8080:80"
        volumes:
            - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - api-1
            - api-2
            - api-3
            - web
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
            interval: 15s
            timeout: 5s
            retries: 3

    mongo:
        image: mongo:7.0
        restart: unless-stopped
        volumes:
            - mongo-data:/data/db
        healthcheck:
            test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            interval: 10s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7.4-alpine
        restart: unless-stopped
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10

    minio:
        image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        restart: unless-stopped
        command: ["server", "/data", "--console-address", ":9001"]
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudstorage}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
        ports:
            - "9000:9000"
            - "9001:9001"
        volumes:
            - minio-data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 10

    # creates the bucket once MinIO is up, then exits
    minio-init:
        image: minio/mc:RELEASE.2025-04-16T18-13-26Z
        depends_on:
            minio: { condition: service_healthy }
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cloudstorage}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
        entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" && mc mb --ignore-existing local/files"]

    clamav:
        image: clamav/clamav:1.4
        restart: unless-stopped
        volumes:
            - clamav-data:/var/lib/clamav

    prometheus:
        image: prom/prometheus:v2.54.1
        profiles: ["monitoring"]
        restart: unless-stopped
        ports:
            - "9090:9090"
        volumes:
            - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        depends_on:
            - api-1
            - api-2
            - api-3

volumes:
    mongo-data:
    redis-data:
    minio-data:
    clamav-data:

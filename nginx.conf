# Reverse proxy and load balancer in front of three API instances and the web app.
# Mounted as /etc/nginx/conf.d/default.conf, so everything here is inside nginx's `http` block.
# The API instances share MongoDB, Redis and the object store, so any instance can serve any request
# (resumable uploads included: the session lives in MongoDB and the chunks in the object store).

# per client address; the API applies its own per-user token buckets behind this
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_status 429;

upstream file_upload_backend {
    least_conn;
    server api-1:5000 max_fails=3 fail_timeout=30s;
    server api-2:5000 max_fails=3 fail_timeout=30s;
    server api-3:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream web_frontend {
    server web:3097;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    # MAX_FILE_SIZE (100 MB) plus multipart overhead; uploads can be slow
    client_max_body_size 110m;
    client_body_timeout 300s;

    # stream request bodies to the API as they arrive instead of spooling them to the proxy's disk first
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # one id from the edge to the API's structured logs
    proxy_set_header X-Request-Id $request_id;

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://file_upload_backend;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # which instance answered (handy when following one request through the logs)
        add_header X-Upstream $upstream_addr always;
    }

    location = /health {
        access_log off;
        proxy_pass http://file_upload_backend;
    }

    location = /health/ready {
        proxy_pass http://file_upload_backend;
    }

    location /api-docs {
        proxy_pass http://file_upload_backend;
    }

    location = /openapi.json {
        proxy_pass http://file_upload_backend;
    }

    # metrics stay on the internal network: Prometheus scrapes each instance directly
    location = /metrics {
        return 404;
    }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # the web app's build output never changes under the same name
    location /_next/static/ {
        proxy_pass http://web_frontend;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://web_frontend;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
